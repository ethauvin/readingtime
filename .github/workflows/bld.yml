name: bld-ci

on: [push, pull_request, workflow_dispatch]

env:
  COVERAGE_JDK: "21"
  KOTLIN_VERSION: "2.4.20"

jobs:
  build-bld-project:
    strategy:
      matrix:
        java-version: [17, 21, 25]
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ matrix.java-version }} with Kotlin ${{ matrix.kotlin-version }}
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: ${{ matrix.java-version }}

      - name: Setup Kotlin ${{ env.KOTLIN_VERSION }}
        uses: fwilhe2/setup-kotlin@main
        with:
          version: ${{ env.KOTLIN_VERSION }}

      - name: Cache bld dependencies
        id: cache-bld
        uses: actions/cache@v6
        with:
          path: |
            examples/bld/lib
            lib
          key: ${{ runner.os }}-bld-java${{ matrix.java-version }}-lib

      - name: Compile and run examples [bld example]
        working-directory: examples/bld
        run: |
          ./bld --auto-download-purge clean compile
          ./bld run --args="example.html"
          ./bld run-java --args="example.html"

      - name: Run examples [gradle example]
        working-directory: examples/gradle
        run: |
          ./gradlew run --args="example.html"
          ./gradlew run --args="example.html"

      - name: Compile source
        run: ./bld clean compile

      - name: Run tests
        id: tests
        run: ./bld jacoco

      - name: Run reporter
        if: always() && steps.tests.outcome == 'failure'
        run: ./bld --offline reporter --all

      - name: Remove pom.xml
        if: success() && matrix.java-version == env.COVERAGE_JDK
          && matrix.os == 'ubuntu-latest'
        run: rm -rf pom.xml

      - name: Add Sonar jdkHome
        if: success() && matrix.java-version == env.COVERAGE_JDK && matrix.os == 'ubuntu-latest'
        run: printf "\nsonar.java.jdkHome=${{ env.JAVA_HOME }}\n" >> sonar-project.properties

      - name: Debug Sonar config
        if: success() && matrix.java-version == env.COVERAGE_JDK && matrix.os == 'ubuntu-latest'
        run: |
          echo "--- sonar-project.properties ---"
          cat sonar-project.properties || echo "FILE MISSING"
          echo "--- env check ---"
          echo "GITHUB_TOKEN set? $([ -n "$GITHUB_TOKEN" ] && echo yes || echo no)"
          echo "SONAR_TOKEN length: ${#SONAR_TOKEN}"
          echo "SONAR_TOKEN first 4: ${SONAR_TOKEN:0:4}"
          # Test token against API - will 403 if token is bad
          curl -s -o /tmp/out.json -w "HTTP %{http_code}\n" -u "$SONAR_TOKEN:" "https://api.sonarcloud.io/api/projects/search?organization=ethauvin"
          cat /tmp/out.json | head -c 500
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        if: success() && matrix.java-version == env.COVERAGE_JDK
          && matrix.os == 'ubuntu-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
